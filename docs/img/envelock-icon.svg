<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Envelock">
  <!-- Envelock -- PHP source protection. Project page: https://miguelenred.es/envelock (Apache-2.0). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A6BD8"/>
      <stop offset="1" stop-color="#2C3791"/>
    </linearGradient>
    <linearGradient id="env" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7EAFB"/>
    </linearGradient>
  </defs>

  <!-- rounded-square badge; corners transparent -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bg)"/>

  <!-- padlock shackle -->
  <path d="M101 120 L101 101 A27 27 0 0 1 155 101 L155 120"
        fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round"/>

  <!-- lock body shaped as an envelope -->
  <rect x="78" y="116" width="100" height="88" rx="16" fill="url(#env)"/>

  <!-- envelope flap crease -->
  <path d="M86 128 L128 160 L170 128"
        fill="none" stroke="#2C3791" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- envelope lower folds (subtle) -->
  <path d="M88 192 L120 166 M168 192 L136 166"
        fill="none" stroke="#C3C9EF" stroke-width="7" stroke-linecap="round"/>
</svg>
