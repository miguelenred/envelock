[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
target-version = "py310"
line-length = 100
# Upstream library sources and binaries are not Envelock code.
extend-exclude = ["third_party", "prebuilt"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# The `native` pytest fixture is imported from test_native.py and requested by parameter name.
"tests/test_bytecode_guard.py" = ["F811"]
