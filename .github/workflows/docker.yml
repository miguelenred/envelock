name: Container image (GHCR)
# Builds a PHP 8.3 image with the Envelock loader preinstalled (see the Dockerfile; it downloads the
# official prebuilt release binary) and pushes it to ghcr.io/miguelenred/envelock. Runs when a GitHub
# Release is PUBLISHED (so the prebuilt asset the Dockerfile fetches already exists), or by hand for a
# given version. The image carries no keys; it is the generic loader.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to build (e.g. 1.1.2)'
        required: true
permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve the release version (no shell interpolation)
        id: v
        env:
          REL: ${{ github.event.release.tag_name }}
          INP: ${{ github.event.inputs.version }}
        run: |
          ver="${REL:-$INP}"
          case "$ver" in
            [0-9]*.[0-9]*.[0-9]*) echo "version=$ver" >> "$GITHUB_OUTPUT" ;;
            *) echo "bad version: $ver" >&2; exit 1 ;;
          esac
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.v.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            ENVELOCK_VERSION=${{ steps.v.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
